name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to build and publish (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$tag'. Expected format like v1.0.0 or v1.0.0-rc.1."
          }

          .\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseDir = Join-Path $PWD 'dist\release'
          if (Test-Path $releaseDir) {
            Remove-Item $releaseDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $exeName = "WhatsMySpeed-$tag-win-x64.exe"
          $zipName = "WhatsMySpeed-$tag-win-x64.zip"
          $exePath = Join-Path $releaseDir $exeName
          $zipPath = Join-Path $releaseDir $zipName
          $sumPath = Join-Path $releaseDir 'checksums.txt'

          Copy-Item -Path 'WhatsMySpeed.exe' -Destination $exePath -Force
          Compress-Archive -Path 'WhatsMySpeed.exe', 'LICENSE', 'README.md', 'PRIVACY.md' -DestinationPath $zipPath -Force

          Get-FileHash -Path $exePath, $zipPath -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path $sumPath -Encoding ASCII

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $exeAsset = "dist/release/WhatsMySpeed-$tag-win-x64.exe"
          $zipAsset = "dist/release/WhatsMySpeed-$tag-win-x64.zip"
          $sumAsset = "dist/release/checksums.txt"

          $prevEAP = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $viewExit = $LASTEXITCODE
          $ErrorActionPreference = $prevEAP

          if ($viewExit -eq 0) {
            gh release upload $tag $exeAsset $zipAsset $sumAsset --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $ghArgs = @(
              'release', 'create', $tag,
              $exeAsset, $zipAsset, $sumAsset,
              '--title', "WhatsMySpeed $tag",
              '--generate-notes',
              '--repo', $env:GITHUB_REPOSITORY
            )
            if ($tag -match '-') {
              $ghArgs += '--prerelease'
            }
            & gh @ghArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
