name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vet, Test, and Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -v -p 1 -count=1 -timeout 2m ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
